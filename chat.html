<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talking — mindspace</title>
<meta name="description" content="A private, anonymous conversation space.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
  --night:#FFF6EC;
  --night-2:#FFFFFF;
  --night-3:#FFEADA;
  --sand:#2B2438;
  --sand-dim:#6B6178;
  --amber:#FF7A45;
  --amber-deep:#E85D2C;
  --sage:#2EC4B6;
  --lavender:#8B7FD6;
  --sun:#FFC857;
  --line:rgba(43,36,56,0.12);
  --radius:18px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--night); color:var(--sand); font-family:var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;}
  a{color:inherit;}
  .wrap{max-width:720px; margin:0 auto; padding:0 20px; width:100%;}

  .crisis-bar{position:sticky; top:0; z-index:100; background:var(--amber); color:var(--night); font-weight:600; font-size:13.5px; flex:none;}
  .crisis-bar .wrap{max-width:1080px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px 16px; padding:8px 20px; text-align:center;}
  .crisis-bar a{text-decoration:underline; text-underline-offset:2px; white-space:nowrap;}
  .crisis-bar .sep{opacity:.55;}

  header.chat-head{border-bottom:1px solid var(--line); padding:14px 0; flex:none;}
  header.chat-head .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .guide-id{display:flex; align-items:center; gap:10px;}
  .guide-id .orb{width:34px; height:34px; border-radius:50%; flex:none;}
  .guide-id h1{font-family:var(--font-display); font-weight:500; font-size:17px; margin:0;}
  .guide-id .vibe{font-size:12px; color:var(--sand-dim); margin:0;}
  .head-actions{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    background:transparent; border:1px solid var(--line); color:var(--sand);
    width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn[aria-pressed="true"]{border-color:var(--amber); color:var(--amber);}
  .icon-btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  .end-link{font-size:13px; color:var(--sand-dim); text-decoration:none; border:1px solid var(--line); padding:8px 14px; border-radius:999px;}
  .end-link:hover{color:var(--sand); border-color:var(--sand-dim);}

  main{flex:1; overflow-y:auto; padding:24px 0 12px;}
  .thread{display:flex; flex-direction:column; gap:14px;}
  .msg{max-width:80%; padding:12px 16px; border-radius:16px; font-size:15px;}
  .msg.bot{align-self:flex-start; background:var(--night-2); border:1px solid var(--line); border-bottom-left-radius:4px;}
  .msg.user{align-self:flex-end; background:var(--night-3); border-bottom-right-radius:4px;}
  .msg.system-note{align-self:center; font-size:12.5px; color:var(--sand-dim); background:transparent; text-align:center; max-width:90%;}

  /* ---------- escalation state ---------- */
  .escalation{
    display:none;
    align-self:stretch; max-width:100%;
    background:var(--night-2); border:2px solid var(--amber); border-radius:var(--radius);
    padding:22px; margin-top:4px;
  }
  .escalation.show{display:block;}
  .escalation h2{font-family:var(--font-display); font-weight:500; font-size:19px; margin:0 0 8px;}
  .escalation p{font-size:14.5px; color:var(--sand-dim); margin:0 0 16px;}
  .escalation-actions{display:flex; flex-wrap:wrap; gap:10px;}
  .escalation-actions a{
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    font-weight:700; font-size:14px; padding:11px 18px; border-radius:999px;
  }
  .escalation-actions .primary{background:var(--amber); color:var(--night);}
  .escalation-actions .primary:hover{background:var(--amber-deep);}
  .escalation-actions .ghost{border:1px solid var(--line); color:var(--sand);}

  footer.composer{border-top:1px solid var(--line); padding:14px 0 20px; flex:none;}
  .composer-row{display:flex; gap:10px; align-items:flex-end;}
  #msg-input{
    flex:1; resize:none; background:var(--night-2); border:1px solid var(--line); color:var(--sand);
    border-radius:16px; padding:12px 16px; font-family:var(--font-body); font-size:15px; max-height:120px;
  }
  #msg-input:focus-visible{outline:2px solid var(--amber); outline-offset:1px;}
  #send-btn{
    flex:none; background:var(--amber); color:var(--night); border:none; border-radius:50%;
    width:44px; height:44px; font-size:17px; cursor:pointer;
  }
  #send-btn:hover{background:var(--amber-deep);}
  #send-btn:focus-visible{outline:2px solid var(--sand); outline-offset:2px;}
  .composer-note{font-size:11.5px; color:var(--sand-dim); margin:8px 4px 0;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

  <div class="crisis-bar" role="banner">
    <div class="wrap">
      <span>In crisis right now?</span>
      <a href="tel:988">Call or text 988</a>
      <span class="sep">·</span>
      <a href="sms:741741&body=HOME">Text HOME to 741741</a>
      <span class="sep">·</span>
      <a href="tel:911">Emergency: call 911</a>
    </div>
  </div>

  <header class="chat-head">
    <div class="wrap">
      <div class="guide-id">
        <svg class="orb" id="head-orb" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#E8A657"/></svg>
        <div>
          <h1 id="head-name">Guide</h1>
          <p class="vibe" id="head-vibe">support guide</p>
        </div>
      </div>
      <div class="head-actions">
        <button class="icon-btn" id="mute-btn" type="button" aria-pressed="false" title="Mute voice">🔊</button>
        <a class="end-link" href="index.html">End chat</a>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="thread" id="thread"></div>
    </div>
  </main>

  <footer class="composer">
    <div class="wrap">
      <div class="composer-row">
        <textarea id="msg-input" rows="1" placeholder="Type anything. Nothing is saved." aria-label="Message"></textarea>
        <button id="send-btn" type="button" aria-label="Send">↑</button>
      </div>
      <p class="composer-note">Anonymous · nothing saved · not a replacement for 988 or a real person</p>
    </div>
  </footer>

<script>
/*
  ================================================================
  INTEGRATION NOTE — read before Week 3
  ================================================================
  Right now sendToGuide() below returns a scripted local response.
  It is NOT connected to Claude or any backend yet — on purpose,
  per the project plan: the real risk-detection spec needs to exist
  and get reviewed before real conversations flow through this.

  When that's ready, sendToGuide() gets replaced with a fetch() to
  a Supabase Edge Function, which calls the Claude API server-side
  (API key never touches this file) and returns:
    { reply: string, risk_flag: boolean }

  risk_flag=true is what triggers showEscalation() below.
  See /supabase/functions/chat/index.ts for the backend template.
  ================================================================
*/

const params = new URLSearchParams(location.search);
const guideId = params.get('guide') || 'sol';
const lang = params.get('lang') || 'en';

const guides = {
  wren:{color:'#8FA98C', name:{en:'Wren',es:'Wren'}, vibe:{en:'steady and quiet',es:'firme y tranquilo/a'}, pitch:1.0, rate:0.95},
  sol:{color:'#E8A657', name:{en:'Sol',es:'Sol'}, vibe:{en:'warm and encouraging',es:'cálido/a y alentador/a'}, pitch:1.15, rate:1.0},
  moss:{color:'#6E8B72', name:{en:'Moss',es:'Moss'}, vibe:{en:'grounded, doesn\u2019t rush you',es:'con los pies en la tierra'}, pitch:0.9, rate:0.9},
  ember:{color:'#D97757', name:{en:'Ember',es:'Ember'}, vibe:{en:'gentle and curious',es:'suave y curioso/a'}, pitch:1.05, rate:1.0},
};
const guide = guides[guideId] || guides.sol;

document.getElementById('head-orb').querySelector('circle').setAttribute('fill', guide.color);
document.getElementById('head-name').textContent = guide.name[lang];
document.getElementById('head-vibe').textContent = guide.vibe[lang];

let muted = false;
const muteBtn = document.getElementById('mute-btn');
muteBtn.addEventListener('click', ()=>{
  muted = !muted;
  muteBtn.setAttribute('aria-pressed', muted);
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if(muted) window.speechSynthesis.cancel();
});

const thread = document.getElementById('thread');

function addMessage(text, role){
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = text;
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;
  return el;
}

function speak(text){
  if(muted || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.pitch = guide.pitch; u.rate = guide.rate; u.lang = lang==='en' ? 'en-US' : 'es-ES';
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function showEscalation(){
  const el = document.createElement('div');
  el.className = 'escalation show';
  el.innerHTML = `
    <h2>${lang==='en' ? "It sounds like things feel really heavy right now." : 'Parece que las cosas se sienten muy pesadas ahora mismo.'}</h2>
    <p>${lang==='en' ? "I'm not able to give you the kind of help a real person can in this moment. Please reach out right now — someone is available immediately." : 'No puedo darte el tipo de ayuda que una persona real puede en este momento. Por favor comunícate ahora mismo — alguien está disponible de inmediato.'}</p>
    <div class="escalation-actions">
      <a class="primary" href="tel:988">${lang==='en' ? 'Call 988 now' : 'Llama al 988 ahora'}</a>
      <a class="ghost" href="sms:741741&body=HOME">${lang==='en' ? 'Text HOME to 741741' : 'Envía HOME al 741741'}</a>
    </div>
  `;
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;
}

/*
  Temporary local stand-in for the backend call.
  The trigger word below is a UI DEMO ONLY so you and your advisor
  can see and test what the escalation screen looks and feels like
  — it is deliberately not a real keyword/risk detector. Real
  detection logic is a Week 3 task and belongs in the backend,
  not hardcoded here.
*/
function sendToGuide(userText){
  return new Promise(resolve=>{
    setTimeout(()=>{
      if(userText.trim().toUpperCase() === 'TESTESCALATION'){
        resolve({ reply: null, risk_flag: true });
      } else {
        const stock = lang==='en'
          ? ["I hear you. Want to say more about that?", "That sounds like a lot to carry. I'm listening.", "Thanks for telling me that — take your time."]
          : ["Te escucho. ¿Quieres contarme más?", "Suena pesado. Aquí estoy.", "Gracias por decirme eso — tómate tu tiempo."];
        resolve({ reply: stock[Math.floor(Math.random()*stock.length)], risk_flag: false });
      }
    }, 500);
  });
}

const input = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');

async function handleSend(){
  const text = input.value.trim();
  if(!text) return;
  addMessage(text, 'user');
  input.value = '';
  input.style.height = 'auto';

  const thinking = addMessage(lang==='en' ? '…' : '…', 'bot');
  const { reply, risk_flag } = await sendToGuide(text);
  thinking.remove();

  if(risk_flag){
    showEscalation();
  } else {
    addMessage(reply, 'bot');
    speak(reply);
  }
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); }
});
input.addEventListener('input', ()=>{
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// opening message
const openers = {
  en: `Hi, I'm ${guide.name.en}. No pressure — I'm just here if you want to talk. What's on your mind?`,
  es: `Hola, soy ${guide.name.es}. Sin presión, estoy aquí si quieres hablar. ¿Qué tienes en mente?`,
};
addMessage(openers[lang], 'bot');
speak(openers[lang]);
</script>
</body>
</html>
